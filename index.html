<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050510">
<title>¿Hacemos las paces?</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
/* Fondo Cyberpunk con cuadrícula */
html,body{width:100%;height:100%;overflow:hidden;font-family:'Share Tech Mono', monospace, Courier, sans-serif;background-color:#050510;background-image:linear-gradient(rgba(0,255,204,.07) 1px, transparent 1px),linear-gradient(90deg, rgba(0,255,204,.07) 1px, transparent 1px);background-size:30px 30px;color:#e0e0e0;touch-action:manipulation}
body{user-select:none;-webkit-user-select:none}
input,select,textarea{user-select:text;-webkit-user-select:text;font-family:'Share Tech Mono', monospace}

/* Partículas de datos cayendo (Matrix vibe) */
.bg{position:fixed;top:0;pointer-events:none;z-index:1;box-shadow:0 0 8px currentColor;animation:drop linear forwards}
@keyframes drop{from{transform:translateY(-10dvh);opacity:.8}to{transform:translateY(110dvh);opacity:0}}

.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;z-index:2;overflow-y:auto;transition:opacity .5s;background:radial-gradient(circle at center, transparent 0%, #050510 100%)}
.screen.hide{opacity:0;pointer-events:none}
.alt{background:rgba(5,5,16,.9);backdrop-filter:blur(8px);z-index:3}

/* Elemento central: Contenedor para Cheems Futurista */
.big {
  width: clamp(110px, 25vw, 160px);
  height: clamp(110px, 25vw, 160px);
  border-radius: 50%;
  border: 3px solid #00ffcc;
  box-shadow: 0 0 20px rgba(0,255,204,.6), 0 0 30px rgba(255,0,255,.4);
  margin-bottom: 20px;
  background-color: #050510;
  
  /* 👇 AQUÍ VA EL NOMBRE DE TU IMAGEN O GIF 👇 */
  background-image: url('cheems.gif'); 
  
  background-size: cover;
  background-position: center;
  position: relative;
  animation: float 3s ease-in-out infinite;
}

/* Efecto de flotar con brillo para la imagen */
@keyframes float {
  0%, 100% { transform: translateY(0); box-shadow: 0 0 20px rgba(0,255,204,.6), 0 0 30px rgba(255,0,255,.4); }
  50% { transform: translateY(-12px); box-shadow: 0 0 30px rgba(0,255,204,.9), 0 0 45px rgba(255,0,255,.7); }
}

h1{font-size:clamp(24px,7vw,42px);font-weight:400;color:#fff;line-height:1.15;margin-bottom:10px;text-shadow:0 0 5px #00ffcc, 0 0 15px #00ffcc;text-transform:uppercase;letter-spacing:1px}
.alt h1{text-shadow:0 0 5px #ff00ff, 0 0 15px #ff00ff}
h1 em{font-style:normal;color:#ff00ff;text-shadow:0 0 5px #ff00ff, 0 0 15px #ff00ff}

.sub{font-size:clamp(14px,3.9vw,18px);color:#a0a0b0;max-width:480px;line-height:1.45;min-height:3.6em;margin-bottom:26px}
.alt .sub{min-height:0;margin-bottom:20px}
.caret{display:inline-block;width:8px;height:1em;background:#00ffcc;vertical-align:middle;margin-left:4px;box-shadow:0 0 8px #00ffcc;animation:blink .8s steps(2) infinite}
@keyframes blink{50%{opacity:0}}

#buttons{display:flex;gap:22px;align-items:center;justify-content:center;flex-wrap:wrap;min-height:110px}
button{font:inherit;border:2px solid;cursor:pointer;padding:16px 44px;font-size:22px;text-transform:uppercase;transition:all .2s;background:transparent}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:none;border-color:#fff!important;box-shadow:0 0 15px rgba(255,255,255,.8)!important}

/* Botón SÍ - Neón Cyan */
#yes{border-color:#00ffcc;color:#00ffcc;box-shadow:0 0 10px rgba(0,255,204,.2), inset 0 0 10px rgba(0,255,204,.2)}
#yes:hover{background:#00ffcc;color:#000;box-shadow:0 0 20px #00ffcc, inset 0 0 20px #00ffcc}

/* Botón NO - Neón Magenta */
#no{border-color:#ff00ff;color:#ff00ff;box-shadow:0 0 10px rgba(255,0,255,.2), inset 0 0 10px rgba(255,0,255,.2)}
#no:hover{background:#ff00ff;color:#000;box-shadow:0 0 20px #ff00ff}
#no.soft{font-size:16px;padding:12px 28px}
#yes:active,#send:active{transform:scale(.95)}

/* Formulario Tech */
form{background:rgba(10,10,20,.85);padding:22px 20px;border:1px solid #333;width:100%;max-width:440px;display:flex;flex-direction:column;gap:12px;text-align:left;box-shadow:0 10px 30px rgba(0,0,0,.8);position:relative}
form::before{content:'';position:absolute;top:0;left:0;width:100%;height:3px;background:linear-gradient(90deg, #00ffcc, #ff00ff)}
label{font-size:13px;color:#00ffcc;margin-bottom:-6px;text-transform:uppercase;letter-spacing:1px}
input,select,textarea{width:100%;padding:12px 14px;border:1px solid #444;background:rgba(0,255,204,.05);color:#fff;font-size:16px;transition:all .3s}
select option{background:#0a0a14;color:#fff}
select option:checked,select option:hover{background:#00ffcc;color:#000}
input:focus,select:focus,textarea:focus{border-color:#ff00ff;box-shadow:0 0 10px rgba(255,0,255,.3)}
textarea{resize:none;min-height:70px}

/* Botón de envío */
#send{background:rgba(0,255,204,.1);border-color:#00ffcc;color:#00ffcc;padding:15px;font-size:17px;margin-top:4px}
#send:hover:not(:disabled){background:#00ffcc;color:#000;box-shadow:0 0 20px #00ffcc}
#send:disabled{opacity:.5;cursor:wait;border-color:#555;color:#555;box-shadow:none}

#err{color:#ff3366;font-size:14px;min-height:1.2em;text-shadow:0 0 5px #ff3366}
.note{font-size:clamp(13px,3.6vw,15px);color:#a0a0b0;max-width:480px;margin-top:16px;padding:12px 16px;background:rgba(0,0,0,.5);border-left:4px solid #ff00ff;line-height:1.5}

/* Chispas de sistema en vez de confeti */
.conf{position:absolute;top:-20px;pointer-events:none;animation:glitchFall linear forwards;box-shadow:0 0 8px currentColor}
@keyframes glitchFall{
  0%{transform:translateY(-5dvh) rotate(0);}
  50%{transform:translateY(50dvh) rotate(180deg) translateX(20px);}
  100%{transform:translateY(110dvh) rotate(360deg) translateX(-20px);}
}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<main class="screen" id="stage">
  <div class="big"></div>
  <h1>Me perdonas<br><em>chabela</em>?</h1>
  <p class="sub"><span id="typeText"></span><span class="caret"></span></p>
  <div id="buttons">
    <button id="yes">Sí</button>
    <button id="no">No</button>
  </div>
</main>

<section class="screen alt hide" id="form">
  <div class="big"></div>
  <h1>¡Va que va!</h1>
  <p class="sub">Perfecto Isabel. Ya que me perdonaste, a donde quieres ir?</p>
  <form id="dateForm">
    <label for="nombre">Tu nombre</label>
    <input id="nombre" placeholder="....." required autocomplete="name">
    <label for="plan">Que prefieres?)</label>
    <select id="plan" required>
      <option value="">[ Seleccionar opción ]</option>
      <option>Aplicar PU</option>
      <option>Bafear Tp / Shaft</option>
      <option>Algo del 24/7</option>
      <option>Molestar al Ivan</option>
      <option>Otra actividad</option>
      <option value="otro">Siempre no jaja?</option>
    </select>
    <label for="fecha">Día</label>
    <input type="date" id="fecha">
    <label for="mensaje">Comentarios (Opcional)</label>
    <textarea id="mensaje" placeholder="Escribe lo que quieras..."></textarea>
    <p id="err" role="alert"></p>
    <button type="submit" id="send">Enviar</button>
  </form>
</section>

<section class="screen alt hide" id="ok">
  <div class="big"></div>
  <h1>¡Enviado!</h1>
  <p class="sub">Ahorita te escribo para confirmar todo.</p>
  <p class="note">P.D. Como te amo Chabela.</p>
</section>

<section class="screen alt hide" id="later">
  <div class="big"></div>
  <h1>Aqui seguire para ti</h1>
  <p class="sub">Si cambias de opinion refresca la pagina o molestame en la linea</p>
</section>

<script>
// Pega aquí la URL de tu Apps Script
const WEBHOOK = 'https://script.google.com/macros/s/AKfycbwNU53NGlE61IvV-AbdA2oM8HecIxO0wHRDQ3TQg2HSQuvgvU2ErsgfwYuk1bWdt14xuw/exec';

const $ = id => document.getElementById(id);
const lines = [
  '> Te amo chabela',
  '> Sabes que nada mas tengo ojos para ti',
  '> Te invito algo del 24/7',
  '> Te voy a pasar tus piezas malas'
];
const noText = ['No','Deberas chabela?','Me voy a desvivir por ti','Vamonos al parque chabela','Te voy a gritar que te amo en la linea','Va tú ganas'];
const dodgeSubs = ['','> Deberas le vas a dar que no?','> Mira se movio el boton','> A ver, alcánzalo','> Casi le atinas...','> Bueno mas al rato te vuelvo a migajear'];

/* Sonido (ahora suena a onda cuadrada/retro sci-fi) */
let ac;
function tone() {
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    ac.resume();
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = 'square'; // Le da ese toque a videojuego viejo / computadora
    o.frequency.value = f;
    g.gain.setValueAtTime(v, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(.001, ac.currentTime + d);
    o.connect(g); g.connect(ac.destination);
    o.start(); o.stop(ac.currentTime + d);
  } catch (e) {}
}
  

// Acorde de "victoria" futurista
const win = () => [440, 554, 659, 880].forEach((f, i) => setTimeout(() => tone(f, .2, .1), i * 120));

/* Cuadritos de "Matrix" cayendo */
const colors = ['#00ffcc','#ff00ff','#0088ff','#ffffff'];
function dot() {
  const h = document.createElement('div');
  h.className = 'bg';
  const size = 4 + Math.random() * 8;
  h.style.width = size + 'px';
  h.style.height = (size * (Math.random() * 3 + 1)) + 'px'; // Líneas alargadas a veces
  h.style.left = Math.random() * 100 + '%';
  h.style.color = colors[Math.random() * colors.length | 0];
  h.style.background = 'currentColor';
  h.style.animationDuration = 3 + Math.random() * 5 + 's';
  document.body.appendChild(h);
  setTimeout(() => h.remove(), 9000);
}
setInterval(dot, 300);
for (let i = 0; i < 15; i++) dot();

/* Máquina de escribir tipo consola */
let tw = 0, q = 0;
function type(text, done) {
  const id = ++tw, el = $('typeText');
  let i = 0;
  el.textContent = '';
  (function step() {
    if (id !== tw) return;
    if (i < text.length) { 
        el.textContent += text[i++]; 
        if(i % 3 === 0) tone(1200 + Math.random() * 400, 0.05, 0.02); // Ruidito de tipeo
        setTimeout(step, 40 + Math.random() * 30); 
    }
    else if (done) setTimeout(() => id === tw && done(), 3500);
  })();
}
(function cycle() { type(lines[q], () => { q = (q + 1) % lines.length; cycle(); }); })();

/* Navegación */
function go(id) {
  ['stage','form','ok','later'].forEach(s => $(s).classList.toggle('hide', s !== id));
}

/* Chispas del sistema (Neón confeti) */
function confetti(parent) {
  for (let i = 0; i < 40; i++) {
    const e = document.createElement('div');
    e.className = 'conf';
    const s = 6 + Math.random() * 8;
    e.style.left = Math.random() * 100 + '%'; 
    e.style.width = s + 'px'; 
    e.style.height = s + 'px';
    e.style.color = colors[Math.random() * colors.length | 0];
    e.style.background = 'currentColor';
    e.style.animationDuration = 1.5 + Math.random() * 2 + 's';
    e.style.animationDelay = Math.random() * 0.5 + 's';
    parent.appendChild(e);
    setTimeout(() => e.remove(), 4000);
  }
}

/* Botón No escurridizo */
const MAX = 5;
let tries = 0, lastDodge = 0;
const no = $('no'), yes =$('yes');

function dodge(e) {
  if (tries >= MAX) return;
  e.preventDefault();
  tries++; lastDodge = Date.now();
  tone(300, .2, .1); // Sonido de error/escape
  if (tries < MAX) {
    const r = no.getBoundingClientRect();
    Object.assign(no.style, {
      position: 'fixed', zIndex: 50,
      left: Math.max(10, Math.random() * (innerWidth - r.width - 20)) + 'px',
      top: Math.max(10, Math.random() * (innerHeight - r.height - 20)) + 'px'
    });
  } else {
    Object.assign(no.style, { position: 'static' });
    no.classList.add('soft');
  }
  no.textContent = noText[tries];
  yes.style.fontSize = 22 + tries * 3 + 'px';
  type(dodgeSubs[tries]);
  if (navigator.vibrate) navigator.vibrate(20);
}
no.addEventListener('pointerdown', dodge);
no.addEventListener('pointerenter', e => e.pointerType === 'mouse' && dodge(e));
no.addEventListener('click', () => {
  if (tries >= MAX && Date.now() - lastDodge > 500) go('later');
});

yes.addEventListener('click', () => {
  win(); go('form');
  const d = new Date();
  $('fecha').min = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  confetti($('form'));
});

/* Envío de Datos */
$('dateForm').addEventListener('submit', async e => {
  e.preventDefault();
  const err = $('err'), btn =$('send');
  const data = {
    nombre: $('nombre').value.trim(),
    plan: $('plan').value === 'otro' ? 'Mejor otro día' : $('plan').value,
    fecha: $('fecha').value,
    mensaje: $('mensaje').value.trim()
  };
  err.textContent = '';
  if ($('plan').value !== 'otro' && !data.fecha) { err.textContent = '> ERROR: Se requiere una fecha o elegir Abortar.'; return; }
  if (WEBHOOK.includes('TU_URL')) { err.textContent = '> ERROR DE SISTEMA: Webhook no configurado.'; return; }

  btn.disabled = true; btn.textContent = 'PROCESANDO...';
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), 10000);
  try {
    await fetch(WEBHOOK, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(data), signal: ctl.signal });
    clearTimeout(t);
    go('ok'); confetti($('ok')); win();
  } catch (x) {
    clearTimeout(t);
    btn.disabled = false; btn.textContent = 'REINTENTAR';
    err.textContent = '> FALLA DE CONEXIÓN. Revisa la red.';
  }
});
</script>
</body>
</html>
